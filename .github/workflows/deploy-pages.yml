name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure GitHub Pages is enabled
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getPages({ owner, repo });
              core.info(`GitHub Pages is already enabled for ${owner}/${repo}.`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`GitHub Pages is not enabled for ${owner}/${repo}. Enabling now...`);
                await github.request('POST /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  build_type: 'workflow'
                });
                core.info('GitHub Pages enabled with GitHub Actions as the build source.');
              } else {
                throw error;
              }
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static Storybook output
        run: |
          test -d static
          test -f static/index.html
          touch static/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4